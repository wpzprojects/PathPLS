<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Guía PLS · Admin</title>
<script>
  (function () {
    var t = localStorage.getItem('pls-theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="css/styles.css">
<style>
  /* Tema claro del admin: grupo blanco, paso con tinte sutil, botones de acción
     en tinta sólida (jerarquía por tono, sin tocar el fondo de página). */
  :root{
    --group-bg:#FFFFFF; --group-border:var(--line);
    --step-bg:#F5F5F3; --step-border:#A8A8A8;
    --card-shadow:0 3px 8px rgba(23,33,28,.12), 0 14px 32px -12px rgba(23,33,28,.24);
    --field-bg:#FFFFFF;
    --btn-bg:var(--accent-ink); --btn-border:var(--accent-ink); --btn-ink:#FFFFFF; --btn-hover-bg:var(--accent); --btn-hover-ink:#FFFFFF;
    --group-top-bg:color-mix(in srgb, var(--accent-soft) 72%, var(--accent) 28%);
    --move-border:var(--accent); --move-color:var(--accent); --move-hover-bg:var(--accent); --move-hover-ink:#FFFFFF;
  }
  /* Paleta gris neutra para el admin en tema oscuro (mismos niveles de luz que el
     tema base, sin el tinte verde) — el verde queda reservado a los acentos. */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --surface:#262626; --surface-2:#2E2E2E; --surface-3:#353535;
      --ink:#ECECEC; --ink-2:#CDCDCD; --muted:#9E9E9E;
      --line:#3B3B3B; --line-strong:#505050;
      --group-bg:var(--surface-3); --group-border:var(--line-strong);
      --step-bg:color-mix(in srgb, #2E2E2E 85%, black 15%); --step-border:#8A8A8A;
      --field-bg:var(--surface-2);
      --btn-bg:var(--surface-2); --btn-border:var(--line-strong); --btn-ink:var(--ink); --btn-hover-bg:var(--surface-3); --btn-hover-ink:var(--accent);
      --group-top-bg:color-mix(in srgb, var(--accent-soft) 78%, var(--accent) 22%);
      --move-border:var(--line-strong); --move-color:var(--ink); --move-hover-bg:var(--surface-2); --move-hover-ink:var(--ink);
    }
  }
  :root[data-theme="dark"]{
    --surface:#262626; --surface-2:#2E2E2E; --surface-3:#353535;
    --ink:#ECECEC; --ink-2:#CDCDCD; --muted:#9E9E9E;
    --line:#3B3B3B; --line-strong:#505050;
    --card-shadow:0 4px 10px rgba(0,0,0,.55), 0 18px 40px -14px rgba(0,0,0,.85);
    --group-bg:var(--surface-3); --group-border:var(--line-strong);
    --step-bg:color-mix(in srgb, #2E2E2E 85%, black 15%); --step-border:#8A8A8A;
    --field-bg:var(--surface-2);
    --btn-bg:var(--surface-2); --btn-border:var(--line-strong); --btn-ink:var(--ink); --btn-hover-bg:var(--surface-3); --btn-hover-ink:var(--accent);
    --group-top-bg:color-mix(in srgb, var(--accent-soft) 78%, var(--accent) 22%);
    --move-border:var(--line-strong); --move-color:var(--ink); --move-hover-bg:var(--surface-2); --move-hover-ink:var(--ink);
  }
  body{margin:0}
  .admin-wrap{max-width:1080px;margin:0 auto;padding:24px 22px 90px}
  .admin-card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:16px 18px;margin-bottom:20px;box-shadow:var(--shadow)}
  .admin-card h2{font-size:16px;margin:0 0 10px}
  .admin-field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
  .admin-field label{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .admin-card input:not([type="checkbox"]), .admin-card textarea, .admin-group input:not([type="checkbox"]), .admin-group textarea, .admin-step input:not([type="checkbox"]), .admin-step textarea{
    width:100%;box-sizing:border-box;font-family:var(--body);font-size:14.5px;color:var(--ink);background:var(--field-bg);border:1px solid var(--line-strong);border-radius:7px;padding:8px 10px;margin-bottom:8px
  }
  .admin-card textarea, .admin-group textarea, .admin-step textarea{resize:vertical}
  .admin-sub input[type="checkbox"]{flex:none;width:15px;height:15px;margin:0;accent-color:var(--accent)}
  .admin-row{display:flex;gap:10px;flex-wrap:wrap}
  .admin-row .admin-field{flex:1;min-width:140px}
  .admin-actions{display:flex;gap:10px;margin-top:6px}
  .admin-btn, .admin-danger{font-family:var(--display);font-weight:700;font-size:13px;border-radius:7px;padding:8px 14px;cursor:pointer;border:1px solid var(--btn-border);background:var(--btn-bg);color:var(--btn-ink)}
  .admin-btn:hover{background:var(--btn-hover-bg);border-color:var(--btn-hover-bg);color:var(--btn-hover-ink)}
  .admin-danger:hover{background:var(--btn-hover-bg)}
  .admin-danger.confirming{background:rgba(239,68,68,.16);color:#EF4444;border-color:#EF4444}
  .admin-status{font-family:var(--mono);font-size:12.5px;padding:8px 0;color:var(--muted)}
  .admin-status.ok{color:var(--accent)}
  .admin-status.err{color:var(--flag)}
  #tabsAdmin{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line)}
  #tabsAdmin .tab{padding:8px 14px;border:none;background:none;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;font-family:var(--display);font-weight:700;font-size:14px}
  #tabsAdmin .tab.on{color:var(--accent);border-bottom-color:var(--accent)}
  .admin-group{background:var(--group-bg);border:1px solid var(--group-border);border-radius:10px;padding:16px 18px;margin-bottom:22px;box-shadow:var(--shadow)}
  .admin-group-top{margin:-16px -18px 0;padding:16px 18px 24px;border-radius:9px 9px 0 0;background:var(--group-top-bg)}
  .admin-group-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .admin-group-tag{flex:none;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);background:var(--surface-2);border-radius:5px;padding:4px 8px}
  .admin-group-title{flex:1;min-width:160px;font-weight:800!important;font-size:17px!important;font-family:var(--display)!important;margin-bottom:0!important}
  .admin-group textarea[data-field="gdesc"]{margin-top:8px}
  .admin-move{display:flex;gap:6px;flex:none;flex-wrap:nowrap}
  .admin-move button{flex:none;white-space:nowrap;height:30px;border-radius:6px;border:1px solid var(--move-border);background:var(--surface-2);color:var(--move-color);cursor:pointer;padding:0 10px;font-family:var(--display);font-size:12.5px;font-weight:700;transition:background .15s ease,color .15s ease}
  .admin-move button:not(.admin-danger):not(:disabled):hover{background:var(--move-hover-bg);color:var(--move-hover-ink)}
  .admin-move .admin-danger{background:var(--btn-bg);color:var(--btn-ink);border-color:var(--btn-border)}
  .admin-move .admin-danger:hover{background:var(--btn-hover-bg);color:var(--btn-ink)}
  .admin-move .admin-danger.confirming{background:rgba(239,68,68,.16);color:#EF4444;border-color:#EF4444}
  .admin-move button[data-action^="up-"], .admin-move button[data-action^="down-"]{width:30px;padding:0}
  .admin-move button:disabled{opacity:.35;cursor:default;background:var(--surface-2);color:var(--move-color)}
  .admin-move .admin-danger{width:auto}
  .admin-steps{display:flex;flex-direction:column;margin:0 -18px 12px;padding:16px 18px 0;border-top:1px solid var(--group-border)}
  .admin-step{background:var(--step-bg);border:1px solid var(--step-border);border-radius:7px;padding:10px 12px;position:relative;box-shadow:var(--card-shadow, none)}
  .admin-step-row{display:flex;justify-content:flex-start;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
  .admin-step-num{flex:none;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:5px;min-width:22px;text-align:center;padding:3px 0}
  .admin-step-row .admin-move{margin-left:auto}
  .masthead .brand small{display:block;font-size:9px;letter-spacing:.1em;opacity:.7;text-transform:none}
  .admin-back{margin-left:auto;font-family:var(--display);font-weight:700;font-size:13px;color:#EDF3EF;text-decoration:none;opacity:.85}
  .admin-back:hover{opacity:1;text-decoration:underline}
  .admin-group-desc-wrap{margin-left:62px}
  .admin-insert-zone{position:relative;height:26px;margin:6px 0}
  .admin-insert-zone button{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24px;height:24px;padding:0;border-radius:50%;border:1px solid var(--accent);background:var(--surface);color:var(--accent);font-size:20px;line-height:1;cursor:pointer;transition:background .15s ease,color .15s ease;display:flex;align-items:center;justify-content:center}
  .admin-insert-zone:hover button{background:var(--accent);color:#fff}
  .admin-images{display:flex;align-items:center;gap:6px;margin-bottom:2px;padding:5px;width:100%;box-sizing:border-box;height:55px;background:var(--field-bg);border:1px solid var(--line-strong);border-radius:7px;overflow-x:auto;transition:border-color .12s ease,background .12s ease}
  .admin-images.drop-active{border-color:var(--accent);background:var(--accent-soft)}
  .admin-images-hint{margin:0 0 8px;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .admin-img-thumb{position:relative;flex:none;width:43px;height:43px;border-radius:5px;overflow:hidden;background:var(--surface-3);cursor:grab}
  .admin-img-thumb.dragging{opacity:.35}
  .admin-img-thumb img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .admin-img-del{position:absolute;top:2px;right:2px;width:16px;height:16px;padding:0;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .12s ease,background .12s ease}
  .admin-img-thumb:hover .admin-img-del, .admin-img-del.confirming{opacity:1}
  .admin-img-del.confirming{background:#EF4444}
  .admin-img-add{flex:none;width:43px;height:43px;border-radius:5px;border:1px dashed var(--line-strong);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:20px;position:relative}
  .admin-img-add:hover{border-color:var(--accent);color:var(--accent)}
  .admin-img-add input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}
  .admin-images .admin-upload-status{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;margin-left:2px}
  .admin-images .admin-upload-status.ok{color:var(--accent)}
  .admin-images .admin-upload-status.err{color:var(--flag)}
</style>
</head>
<body>
<header class="masthead">
  <div class="mh-in">
    <div class="brand">Guía PLS <span>Admin</span></div>
    <a class="admin-back" href="index.html">← Volver a la guía</a>
  </div>
</header>

<div class="admin-wrap">
  <div class="admin-card">
    <h2>Conexión con GitHub</h2>
    <div class="admin-field">
      <label>Token personal de GitHub (permiso "repo")</label>
      <input id="token" type="password" placeholder="ghp_...">
    </div>
    <div class="admin-row">
      <div class="admin-field"><label>Owner</label><input id="owner" placeholder="wpzprojects"></div>
      <div class="admin-field"><label>Repo</label><input id="repo" placeholder="PathPLS"></div>
      <div class="admin-field"><label>Branch</label><input id="branch" placeholder="main"></div>
      <div class="admin-field"><label>Archivo</label><input id="path" placeholder="steps.json"></div>
    </div>
    <div class="admin-field">
      <label>Mensaje del commit</label>
      <input id="commitMsg" value="Actualizar pasos de la guía">
    </div>
    <div class="admin-actions">
      <button id="loadBtn" class="admin-btn" type="button">Cargar desde GitHub</button>
      <button id="saveBtn" class="admin-btn" type="button">Guardar en GitHub</button>
    </div>
    <p class="admin-status" id="status">El token solo se guarda en este navegador (localStorage) y se usa únicamente para llamar a la API de GitHub. Nunca se envía a ningún otro sitio.</p>
  </div>

  <div id="tabsAdmin"></div>
  <div id="editorRoot"></div>
</div>

<script src="js/admin.js" defer></script>
</body>
</html>
