<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Guía PLS · Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="css/styles.css">
<style>
  body{margin:0}
  .admin-wrap{max-width:1080px;margin:0 auto;padding:24px 22px 90px}
  .admin-card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:16px 18px;margin-bottom:20px;box-shadow:var(--shadow)}
  .admin-card h2{font-size:16px;margin:0 0 10px}
  .admin-field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
  .admin-field label{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .admin-card input:not([type="checkbox"]), .admin-card textarea, .admin-group input:not([type="checkbox"]), .admin-group textarea, .admin-step input:not([type="checkbox"]), .admin-step textarea{
    width:100%;box-sizing:border-box;font-family:var(--body);font-size:14.5px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line-strong);border-radius:7px;padding:8px 10px;margin-bottom:8px
  }
  .admin-sub input[type="checkbox"]{flex:none;width:15px;height:15px;margin:0;accent-color:var(--accent)}
  .admin-row{display:flex;gap:10px;flex-wrap:wrap}
  .admin-row .admin-field{flex:1;min-width:140px}
  .admin-actions{display:flex;gap:10px;margin-top:6px}
  .admin-btn, .admin-danger{font-family:var(--display);font-weight:700;font-size:13px;border-radius:7px;padding:8px 14px;cursor:pointer;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink)}
  .admin-btn:hover{border-color:var(--accent);color:var(--accent)}
  .admin-danger{border-color:var(--flag);color:var(--flag);background:none}
  .admin-danger:hover{background:var(--flag-soft)}
  .admin-danger.confirming{background:var(--flag);color:#fff;border-color:var(--flag)}
  .admin-status{font-family:var(--mono);font-size:12.5px;padding:8px 0;color:var(--muted)}
  .admin-status.ok{color:var(--accent)}
  .admin-status.err{color:var(--flag)}
  #tabsAdmin{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line)}
  #tabsAdmin .tab{padding:8px 14px;border:none;background:none;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;font-family:var(--display);font-weight:700;font-size:14px}
  #tabsAdmin .tab.on{color:var(--accent);border-bottom-color:var(--accent)}
  .admin-group{background:var(--surface-3);border:1px solid var(--accent);border-radius:10px;padding:16px 18px;margin-bottom:22px;box-shadow:var(--shadow)}
  .admin-group-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .admin-group-tag{flex:none;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:5px;padding:4px 8px}
  .admin-group-title{flex:1;min-width:160px;font-weight:800!important;font-size:17px!important;font-family:var(--display)!important;margin-bottom:0!important}
  .admin-group textarea[data-field="gdesc"]{margin-top:8px}
  .admin-move{display:flex;gap:6px;flex:none;flex-wrap:nowrap}
  .admin-move button{flex:none;white-space:nowrap;height:30px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);cursor:pointer;padding:0 10px;font-family:var(--display);font-size:12.5px;font-weight:700}
  .admin-move button[data-action^="up-"], .admin-move button[data-action^="down-"]{width:30px;padding:0}
  .admin-move button:disabled{opacity:.35;cursor:default}
  .admin-move .admin-danger{width:auto}
  .admin-steps{display:flex;flex-direction:column;margin:12px 0}
  .admin-step{background:color-mix(in srgb, var(--surface-2) 50%, black 50%);border:1px solid var(--accent);border-radius:7px;padding:10px 12px;position:relative}
  .admin-step-row{display:flex;justify-content:flex-start;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
  .admin-step-num{flex:none;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:5px;min-width:22px;text-align:center;padding:3px 0}
  .admin-step-row .admin-move{margin-left:auto}
  .masthead .brand small{display:block;font-size:9px;letter-spacing:.1em;opacity:.7;text-transform:none}
  .admin-back{margin-left:auto;font-family:var(--display);font-weight:700;font-size:13px;color:#EDF3EF;text-decoration:none;opacity:.85}
  .admin-back:hover{opacity:1;text-decoration:underline}
  .admin-group-desc-wrap{margin-left:62px}
  .admin-insert-zone{position:relative;height:26px;margin:6px 0}
  .admin-insert-zone button{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);font-size:15px;line-height:1;cursor:pointer;opacity:.45;transition:opacity .15s ease,border-color .15s ease,color .15s ease;display:flex;align-items:center;justify-content:center}
  .admin-insert-zone:hover button{opacity:1;border-color:var(--accent);color:var(--accent)}
  .admin-file-upload{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .admin-file-upload input[type="file"]{flex:1;font-size:12.5px;color:var(--muted)}
  .admin-upload-status{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
  .admin-upload-status.ok{color:var(--accent)}
  .admin-upload-status.err{color:var(--flag)}
</style>
</head>
<body>
<header class="masthead">
  <div class="mh-in">
    <div class="brand">Guía PLS <span>Admin</span></div>
    <a class="admin-back" href="index.html">← Volver a la guía</a>
  </div>
</header>

<div class="admin-wrap">
  <div class="admin-card">
    <h2>Conexión con GitHub</h2>
    <div class="admin-field">
      <label>Token personal de GitHub (permiso "repo")</label>
      <input id="token" type="password" placeholder="ghp_...">
    </div>
    <div class="admin-row">
      <div class="admin-field"><label>Owner</label><input id="owner" placeholder="wpzprojects"></div>
      <div class="admin-field"><label>Repo</label><input id="repo" placeholder="PathPLS"></div>
      <div class="admin-field"><label>Branch</label><input id="branch" placeholder="main"></div>
      <div class="admin-field"><label>Archivo</label><input id="path" placeholder="steps.json"></div>
    </div>
    <div class="admin-field">
      <label>Mensaje del commit</label>
      <input id="commitMsg" value="Actualizar pasos de la guía">
    </div>
    <div class="admin-actions">
      <button id="loadBtn" class="admin-btn" type="button">Cargar desde GitHub</button>
      <button id="saveBtn" class="admin-btn" type="button">Guardar en GitHub</button>
    </div>
    <p class="admin-status" id="status">El token solo se guarda en este navegador (localStorage) y se usa únicamente para llamar a la API de GitHub. Nunca se envía a ningún otro sitio.</p>
  </div>

  <div id="tabsAdmin"></div>
  <div id="editorRoot"></div>
</div>

<script src="js/admin.js" defer></script>
</body>
</html>
